{% extends 'clinic/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:85vh">
  <div class="card p-4" style="width:100%;max-width:380px">
    <div class="text-center mb-3">
      <i class="bi bi-hospital text-primary" style="font-size:2.5rem"></i>
      <h4 class="mt-2 mb-0">Clinic Management System</h4>
      <p class="text-muted small">Sign in to continue</p>
    </div>
    {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
